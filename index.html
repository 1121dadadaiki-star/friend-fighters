<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#e9eaff"><title>友達ホテイソンゲーム</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9eaff;color:#533b2c;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}body{display:flex;justify-content:center;overscroll-behavior:none}.app{width:min(100%,540px);padding:calc(12px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:7px}.brand{font-weight:950;font-size:clamp(17px,4.2vw,25px);letter-spacing:-.8px;white-space:nowrap}.scores{display:flex;gap:6px}.score{min-width:68px;background:#fff9e7;border:3px solid #dbc08a;border-radius:17px;padding:4px 8px;text-align:center;font-size:11px;font-weight:900}.score strong{display:block;font-size:22px;color:#d67c51}.controls{display:flex;justify-content:space-between;align-items:center;gap:10px}.next{display:flex;align-items:center;gap:10px;background:#fff9e7;border:3px solid #dbc08a;border-radius:17px;padding:5px 12px;font-weight:900;font-size:14px;min-height:70px}.next img{width:54px;height:54px;object-fit:contain}button{border:0;border-radius:15px;padding:13px 16px;background:#82ad82;color:white;font-weight:900;font-size:15px;box-shadow:0 4px 0 #5b835b;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px 0 #5b835b}.board{position:relative;border:5px solid #aa7950;border-radius:24px;background:#f8f9ff;overflow:hidden;touch-action:none;flex:none;box-shadow:inset 0 -8px 0 #f4e6d7}.board canvas{display:block;width:100%;height:100%;touch-action:none}.tip{text-align:center;font-weight:800;color:#8b6a51;font-size:13px}.overlay{display:none;position:absolute;inset:0;background:#202039aa;align-items:center;justify-content:center;flex-direction:column;color:white;gap:13px;font-weight:900;font-size:28px;text-align:center}.overlay.show{display:flex}.overlay small{font-size:16px}.overlay button{background:#e9aa51;box-shadow:0 4px 0 #a86c30}.hint{text-align:center;font-size:11px;color:#9b8b80}@media(max-height:740px){.app{gap:6px;padding-top:6px}.next{min-height:55px}.next img{width:40px;height:40px}.tip{font-size:11px}}
</style></head><body><main class="app"><div class="top"><div class="brand">😂 友達ホテイソンゲーム</div><div class="scores"><div class="score">SCORE<strong id="score">0</strong></div><div class="score">BEST<strong id="best">0</strong></div></div></div><div class="controls"><div class="next">NEXT <img id="next" src="faces/01.png" alt="次の友達"></div><button id="restart">やり直す</button></div><div class="board" id="board"><canvas id="game"></canvas><div class="overlay" id="overlay">ゲームオーバー！<small id="final"></small><button id="again">もう一回！</button></div></div><div class="tip">左右に動かして、指を離すと落下！ 同じ友達で合体 ✨</div><div class="hint">写真の形に合わせた多角形の当たり判定・10段階</div></main><script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('game'), ctx=canvas.getContext('2d'),board=$('board');
const images=Array.from({length:10},(_,i)=>{const im=new Image();im.src=`faces/${String(i+1).padStart(2,'0')}.png`;return im});
const SHAPES=[[[0.9968871595330739,0.6326848249027237],[0.5813229571984436,0.9346303501945525],[-0.9019455252918288,0.9346303501945525],[-1.0,0.3649805447470817],[-0.3369649805447471,-0.8319066147859923],[0.06303501945525292,-0.9330739299610895],[0.7867704280155642,-0.154863813229572]],[[0.44849785407725323,-0.8798283261802575],[0.7489270386266095,-0.4206008583690987],[0.728898426323319,0.9985693848354793],[-0.751788268955651,0.9985693848354793],[-0.37839771101573677,-0.6924177396280401],[-0.059370529327610874,-0.9856938483547926]],[[0.5618892508143323,0.8908794788273615],[0.23289902280130292,0.995114006514658],[-0.30456026058631924,0.7882736156351792],[-0.7231270358306189,0.11563517915309446],[-0.7833876221498371,-0.3306188925081433],[-0.2996742671009772,-0.9641693811074918],[0.3794788273615635,-0.8990228013029316],[0.7166123778501629,-0.4771986970684039],[0.757328990228013,0.3127035830618892]],[[0.9984051036682615,0.9936204146730463],[-1.0,0.9936204146730463],[-0.3062200956937799,-0.9074960127591707],[0.03349282296650718,-0.9904306220095693],[0.43381180223285487,-0.74481658692185]],[[0.7486187845303868,0.9986187845303868],[-0.75,0.9986187845303868],[-0.75,-1.0],[0.7486187845303868,-1.0]],[[0.7452123230641132,0.3288925895087427],[0.3405495420482931,0.9117402164862615],[-0.26894254787676936,0.9217318900915903],[-0.7535387177352206,0.1273938384679434],[-0.7185678601165695,-0.537052456286428],[-0.2639467110741049,-0.9350541215653622],[0.4054954204829309,-0.861781848459617],[0.7818484596169858,-0.3671940049958368]],[[0.7852062588904695,0.9985775248933144],[-0.786628733997155,0.9985775248933144],[-0.7467994310099573,-0.4366998577524893],[-0.41963015647226176,-0.887624466571835],[0.021337126600284494,-1.0],[0.4438122332859175,-0.6970128022759602]],[[0.8011744966442953,-0.39429530201342283],[0.8246644295302014,0.09563758389261745],[0.5310402684563759,0.7449664429530202],[0.11493288590604027,0.9815436241610739],[-0.44043624161073824,0.7550335570469798],[-0.8179530201342282,0.10067114093959731],[-0.7491610738255033,-0.4949664429530201],[-0.26593959731543626,-0.9546979865771812],[0.2424496644295302,-0.9614093959731543]],[[0.3141405588484335,0.9254868755292125],[-0.2955122777307367,0.9491955969517358],[-0.8035563082133785,0.4072819644369179],[-0.5715495342929721,-0.6545300592718035],[-0.14987298899237933,-0.9864521591871296],[0.292125317527519,-0.8712955122777307],[0.8035563082133785,0.029635901778154106],[0.7646062658763759,0.4953429297205758]],[[0.6800670016750419,-0.6331658291457286],[0.8157453936348409,0.11725293132328309],[0.5276381909547738,0.7520938023450586],[0.06867671691792294,0.998324958123953],[-0.5561139028475712,0.8961474036850922],[-0.830820770519263,0.39195979899497485],[-0.6532663316582915,-0.6432160804020101],[0.05360134003350084,-1.0]]];
const BASE=[24,30,37,45,53,62,72,83,95,108], POINTS=[1,3,6,10,15,21,28,36,45,60];
let W=360,H=610,scale=1,balls=[],score=0,best=0,current=0,next=0,aim=180,gameOver=false,drag=false,cooldown=0,danger=0,prev=0,acc=0,uid=0,merges=[],effects=[];
try{best=Number(localStorage.getItem('hoteison-best')||0)}catch{}$('best').textContent=best;
const rand=()=>Math.floor(Math.random()*4),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function radius(t){return BASE[t]*scale}
function polygon(b){const c=Math.cos(b.a),s=Math.sin(b.a),r=b.r;return SHAPES[b.t].map(([x,y])=>({x:b.x+r*(x*c-y*s),y:b.y+r*(x*s+y*c)}))}
function bbox(p){let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;for(const v of p){minx=Math.min(minx,v.x);maxx=Math.max(maxx,v.x);miny=Math.min(miny,v.y);maxy=Math.max(maxy,v.y)}return {minx,maxx,miny,maxy}}
function body(x,y,t,vx=0,vy=0){const r=radius(t),m=r*r/900;return {id:++uid,t,x,y,r,vx,vy,a:0,w:(Math.random()-.5)*.5,m,inv:1/m,I:m*r*r*.55,age:0,grace:.3,dead:false}}
function fit(){const ww=board.clientWidth;const h=Math.min(ww*1.55,Math.max(350,innerHeight-220));board.style.height=Math.round(h)+'px';const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(ww*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);const oldW=W;W=ww;H=h;scale=Math.min(W/380,H/590);if(!balls.length)aim=W/2;else {const ratio=W/oldW;for(const b of balls){b.x*=ratio;b.y*=ratio;b.r=radius(b.t);b.m=b.r*b.r/900;b.inv=1/b.m;b.I=b.m*b.r*b.r*.55}aim*=ratio}}
function updateNext(){ $('next').src=images[next].src }
function reset(){balls=[];score=0;current=rand();next=rand();aim=W/2;gameOver=false;cooldown=0;danger=0;effects=[];$('score').textContent='0';$('overlay').classList.remove('show');updateNext()}
function axisOverlap(A,B){let depth=Infinity,nx=0,ny=0;for(const p of [A,B])for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length],v=p[i],dx=q.x-v.x,dy=q.y-v.y,L=Math.hypot(dx,dy)||1;const ax=-dy/L,ay=dx/L;let a0=Infinity,a1=-Infinity,b0=Infinity,b1=-Infinity;for(const z of A){const k=z.x*ax+z.y*ay;a0=Math.min(a0,k);a1=Math.max(a1,k)}for(const z of B){const k=z.x*ax+z.y*ay;b0=Math.min(b0,k);b1=Math.max(b1,k)}const ov=Math.min(a1,b1)-Math.max(a0,b0);if(ov<=0)return null;if(ov<depth){depth=ov;nx=ax;ny=ay}}return {depth,nx,ny}}
function resolve(a,b,dt){const pa=polygon(a),pb=polygon(b),ba=bbox(pa),bb=bbox(pb);if(ba.maxx<bb.minx||bb.maxx<ba.minx||ba.maxy<bb.miny||bb.maxy<ba.miny)return;
 const hit=axisOverlap(pa,pb);if(!hit)return;
 if(a.t===b.t && a.t<9 && a.grace<=0 && b.grace<=0 && !a.dead&&!b.dead){a.dead=b.dead=true;merges.push([a,b]);return}
 let {nx,ny,depth}=hit;if((b.x-a.x)*nx+(b.y-a.y)*ny<0){nx=-nx;ny=-ny}
 const inv=a.inv+b.inv;const corr=Math.max(0,depth-.35)*.74/inv;a.x-=nx*corr*a.inv;a.y-=ny*corr*a.inv;b.x+=nx*corr*b.inv;b.y+=ny*corr*b.inv;
 // stable contact impulse, including mild angular motion
 const rx=(a.x+b.x)/2,ry=(a.y+b.y)/2,rax=rx-a.x,ray=ry-a.y,rbx=rx-b.x,rby=ry-b.y;
 const avx=a.vx-a.w*ray,avy=a.vy+a.w*rax,bvx=b.vx-b.w*rby,bvy=b.vy+b.w*rbx;
 const rvx=bvx-avx,rvy=bvy-avy,vn=rvx*nx+rvy*ny;
 if(vn>=0)return;const ca=rax*ny-ray*nx,cb=rbx*ny-rby*nx;const denom=inv+ca*ca/a.I+cb*cb/b.I;const j=-(1.04)*vn/denom;
 a.vx-=j*nx*a.inv;a.vy-=j*ny*a.inv;b.vx+=j*nx*b.inv;b.vy+=j*ny*b.inv;
 a.w=clamp(a.w-ca*j/a.I,-2.2,2.2);b.w=clamp(b.w+cb*j/b.I,-2.2,2.2);
 // gentle tangential friction
 const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty,fr=clamp(-vt/denom,-j*.17,j*.17);
 a.vx-=fr*tx*a.inv;a.vy-=fr*ty*a.inv;b.vx+=fr*tx*b.inv;b.vy+=fr*ty*b.inv;
 }
function wall(b){const bb=bbox(polygon(b));const damp=.16;if(bb.minx<4){b.x+=4-bb.minx;if(b.vx<0)b.vx=-b.vx*damp;b.w*=.8}if(bb.maxx>W-4){b.x-=bb.maxx-(W-4);if(b.vx>0)b.vx=-b.vx*damp;b.w*=.8}if(bb.maxy>H-5){b.y-=bb.maxy-(H-5);if(b.vy>0)b.vy=-b.vy*.06;b.vx*=.94;b.w*=.86;if(Math.abs(b.vy)<14)b.vy=0}}
function step(dt){if(gameOver)return;cooldown=Math.max(0,cooldown-dt);for(const b of balls){b.age+=dt;b.grace-=dt;b.vy+=1500*scale*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.w*dt;b.vx*=.999;b.w*=.996;wall(b)}
 merges=[];for(let k=0;k<5;k++){for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j];if(!a.dead&&!b.dead)resolve(a,b,dt)}for(const b of balls)if(!b.dead)wall(b)}
 if(merges.length){for(const [a,b] of merges){const t=a.t+1,x=(a.x+b.x)/2,y=(a.y+b.y)/2;const c=body(x,y,t,(a.vx+b.vx)*.16,(a.vy+b.vy)*.16);c.grace=.25;balls.push(c);score+=POINTS[t];effects.push({x,y,r:radius(t),age:0});}balls=balls.filter(b=>!b.dead);$('score').textContent=score;if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('hoteison-best',best)}catch{}}}
 for(const e of effects)e.age+=dt;effects=effects.filter(e=>e.age<.45);
 const atTop=balls.some(b=>b.age>1.5&&b.grace<0&&bbox(polygon(b)).miny<Math.max(45,83*scale));danger=atTop?danger+dt:Math.max(0,danger-dt*2);if(danger>2){gameOver=true;$('final').textContent=`SCORE ${score}`;$('overlay').classList.add('show')}
}
function drawImg(t,x,y,r,ang=0,alpha=1){const im=images[t];if(!im.complete||!im.naturalWidth)return;const z=2*r/Math.max(im.naturalWidth,im.naturalHeight);ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.globalAlpha=alpha;ctx.drawImage(im,-im.naturalWidth*z/2,-im.naturalHeight*z/2,im.naturalWidth*z,im.naturalHeight*z);ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);ctx.strokeStyle='#e5ab99';ctx.lineWidth=2;ctx.setLineDash([10,9]);const dangerY=Math.max(45,83*scale);ctx.beginPath();ctx.moveTo(0,dangerY);ctx.lineTo(W,dangerY);ctx.stroke();ctx.setLineDash([]);if(danger>0){ctx.fillStyle=`rgba(230,75,70,${Math.min(.17,danger*.07)})`;ctx.fillRect(0,0,W,dangerY)}
 if(!gameOver){const r=radius(current);const x=clamp(aim,r*.78,W-r*.78);ctx.strokeStyle='#b7a188';ctx.setLineDash([5,8]);ctx.beginPath();ctx.moveTo(x,dangerY);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);drawImg(current,x,Math.max(r*.65,dangerY-r*.7),r,0,.83)}
 for(const b of balls)drawImg(b.t,b.x,b.y,b.r,b.a);
 for(const e of effects){ctx.beginPath();ctx.arc(e.x,e.y,e.r*(.55+e.age*1.9),0,Math.PI*2);ctx.strokeStyle=`rgba(255,177,68,${1-e.age/.45})`;ctx.lineWidth=5;ctx.stroke()}}
function loop(now){if(!prev)prev=now;acc+=Math.min(.05,(now-prev)/1000);prev=now;let k=0;while(acc>=1/120&&k++<8){step(1/120);acc-=1/120}render();requestAnimationFrame(loop)}
function point(e){const rect=canvas.getBoundingClientRect();return clamp(e.clientX-rect.left,0,W)}
canvas.addEventListener('pointerdown',e=>{if(gameOver)return;drag=true;aim=point(e);canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drag)aim=point(e)});
canvas.addEventListener('pointerup',e=>{if(!drag)return;drag=false;aim=point(e);if(gameOver||cooldown>0)return;const r=radius(current);balls.push(body(clamp(aim,r*.8,W-r*.8),Math.max(r*.6,83*scale-r*.8),current));current=next;next=rand();updateNext();cooldown=.45});
canvas.addEventListener('pointercancel',()=>drag=false);
$('restart').onclick=reset;$('again').onclick=reset;window.addEventListener('resize',()=>{fit()});fit();reset();requestAnimationFrame(loop);
</script></body></html>

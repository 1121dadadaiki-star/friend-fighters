<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f9e8bd"><title>FRUIT DROP 🍉</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif;background:#f7e5ba;color:#563b25}body{display:flex;align-items:center;justify-content:center}#app{height:100dvh;max-width:530px;width:100%;display:flex;flex-direction:column;align-items:center;padding:8px;gap:7px}header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:4px 7px}h1{font-size:clamp(19px,5vw,27px);margin:0;letter-spacing:1px}#scorebox{display:flex;gap:7px}.score{background:#fff8e6;border:2px solid #d8b98a;border-radius:12px;padding:5px 13px;text-align:center;min-width:80px;font-size:11px;font-weight:800}.score b{display:block;font-size:22px;color:#db7654}#next{display:flex;align-items:center;gap:10px;background:#fff7e3;border:2px solid #d8b98a;padding:5px 12px;border-radius:14px;font-weight:800;font-size:13px}#nextFruit{font-size:25px}#stageWrap{flex:1;min-height:0;width:100%;position:relative;display:flex;justify-content:center}canvas{width:100%;height:100%;border-radius:17px;border:4px solid #a9794f;background:#fffcf1;touch-action:none;box-shadow:0 5px 0 #c8a16b}#overlay{position:absolute;inset:4px;display:none;flex-direction:column;justify-content:center;align-items:center;background:#fff7e9df;border-radius:12px;text-align:center;gap:14px}#overlay.show{display:flex}#overlay h2{font-size:36px;margin:0;color:#c8664d}#overlay p{margin:0;font-size:19px;font-weight:800}button{border:0;border-radius:14px;background:#ec9565;color:white;font-weight:900;padding:12px 24px;font-size:17px;box-shadow:0 4px 0 #b96c45}button:active{transform:translateY(3px);box-shadow:0 1px 0 #b96c45}footer{font-size:12px;color:#765b41;text-align:center;padding-bottom:3px;font-weight:700}#restart{font-size:13px;padding:9px 13px;background:#88ad8b;box-shadow:0 3px 0 #5e8864}#toolbar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 7px}#tip{font-size:12px;font-weight:800}</style></head><body><div id="app"><header><h1>🍉 FRUIT DROP</h1><div id="scorebox"><div class="score">SCORE<b id="score">0</b></div><div class="score">BEST<b id="best">0</b></div></div></header><div id="toolbar"><div id="next">NEXT <span id="nextFruit">🍒</span></div><button id="restart">やり直す ↻</button></div><div id="stageWrap"><canvas id="game"></canvas><div id="overlay"><h2>GAME OVER</h2><p id="result"></p><button id="again">もう一度あそぶ</button></div></div><footer id="tip">左右に動かして、指を離すと落下！ 同じフルーツで合体 ✨</footer></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');const emojis=['🍒','🍓','🍇','🍊','🍋','🍎','🍐','🍑','🍍','🍈','🍉'];const colors=['#e85664','#ed6c77','#a37acb','#ffb056','#f6dc6d','#f2766c','#b9d87b','#f6a6a2','#edc45b','#b5dc8d','#77b977'];const radii=[15,20,25,31,37,44,51,59,68,78,89];const points=[1,3,6,10,15,21,28,36,45,55,80];let W=350,H=600,scale=1,balls=[],particles=[],score=0,best=0,selected=0,next=1,aim=175,over=false,drag=false,dropDelay=0,spawnAt=0,aboveTime=0,last=0,id=0;const scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),nextEl=document.querySelector('#nextFruit'),overlay=document.querySelector('#overlay');try{best=Number(localStorage.getItem('fruitdrop-best'))||0}catch{}bestEl.textContent=best;const rand=()=>Math.floor(Math.random()*5);function fit(){const r=canvas.getBoundingClientRect();const d=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);W=r.width;H=r.height;scale=d;ctx.setTransform(d,0,0,d,0,0);aim=Math.max(90,Math.min(W-90,aim))}window.addEventListener('resize',fit);function reset(){balls=[];particles=[];score=0;selected=rand();next=rand();aim=W/2;over=false;dropDelay=0;spawnAt=0;aboveTime=0;scoreEl.textContent='0';nextEl.textContent=emojis[next];overlay.classList.remove('show')}function add(x,y,t,vx=0,vy=0){const r=radii[t]*Math.min(1,W/360);const b={id:++id,x:Math.max(r+4,Math.min(W-r-4,x)),y,r,t,vx,vy,age:0,mergeLock:0};balls.push(b);return b}function drop(){if(over||dropDelay>0)return;const r=radii[selected]*Math.min(1,W/360);add(Math.max(r+5,Math.min(W-r-5,aim)),64,selected,0,0);selected=next;next=rand();nextEl.textContent=emojis[next];dropDelay=.58;spawnAt=performance.now()}function pos(e){const r=canvas.getBoundingClientRect();aim=Math.max(12,Math.min(W-12,e.clientX-r.left))}canvas.addEventListener('pointerdown',e=>{if(over)return;drag=true;canvas.setPointerCapture(e.pointerId);pos(e)});canvas.addEventListener('pointermove',e=>{if(drag)pos(e)});canvas.addEventListener('pointerup',e=>{if(!drag)return;pos(e);drag=false;drop()});canvas.addEventListener('pointercancel',()=>drag=false);document.querySelector('#restart').onclick=reset;document.querySelector('#again').onclick=reset;document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')aim-=17;if(e.key==='ArrowRight')aim+=17;if(e.key===' '||e.key==='Enter'){e.preventDefault();drop()}aim=Math.max(10,Math.min(W-10,aim))});function merge(a,b){const t=a.t;const nx=(a.x+b.x)/2,ny=(a.y+b.y)/2;const vx=(a.vx+b.vx)/2,vy=(a.vy+b.vy)/2;balls=balls.filter(q=>q!==a&&q!==b);if(t<10){const c=add(nx,ny,t+1,vx*.5,vy*.4-1.3);c.mergeLock=.15;score+=points[t+1]}else{score+=150}scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('fruitdrop-best',String(best))}catch{}}for(let k=0;k<13;k++){const angle=Math.random()*Math.PI*2,speed=1+Math.random()*4;particles.push({x:nx,y:ny,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color:colors[t]})}}function physics(dt){if(over)return;dropDelay=Math.max(0,dropDelay-dt);const step=dt*60;const floor=H-13;for(const b of balls){b.age+=dt;b.mergeLock=Math.max(0,b.mergeLock-dt);b.vy+=.23*step;b.vx*=Math.pow(.992,step);b.vy*=Math.pow(.997,step);b.x+=b.vx*step;b.y+=b.vy*step;if(b.x<b.r+5){b.x=b.r+5;b.vx=Math.abs(b.vx)*.24}if(b.x>W-b.r-5){b.x=W-b.r-5;b.vx=-Math.abs(b.vx)*.24}if(b.y>floor-b.r){b.y=floor-b.r;b.vy=-Math.abs(b.vy)*.13;b.vx*=.95;if(Math.abs(b.vy)<.3)b.vy=0}}let pairs=[];for(let iter=0;iter<4;iter++){for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001,min=a.r+b.r;if(dist>=min)continue;const nx=dx/dist,ny=dy/dist,overlap=min-dist;if(iter===0&&a.t===b.t&&a.mergeLock<=0&&b.mergeLock<=0&&a.age>.1&&b.age>.1){pairs.push([a,b]);a.mergeLock=b.mergeLock=.2;continue}const push=overlap*.5*.87;a.x-=nx*push;b.x+=nx*push;a.y-=ny*push;b.y+=ny*push;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const impulse=-rel*.18;a.vx-=impulse*nx;b.vx+=impulse*nx;a.vy-=impulse*ny;b.vy+=impulse*ny}}for(const b of balls){b.x=Math.max(b.r+5,Math.min(W-b.r-5,b.x));b.y=Math.min(floor-b.r,b.y)}}const used=new Set;for(const [a,b] of pairs){if(used.has(a)||used.has(b)||!balls.includes(a)||!balls.includes(b))continue;used.add(a);used.add(b);merge(a,b)}const danger=balls.some(b=>b.y-b.r<94&&b.age>1.5&&Math.hypot(b.vx,b.vy)<1.4);aboveTime=danger?aboveTime+dt:Math.max(0,aboveTime-dt*2);if(aboveTime>2.2){over=true;document.querySelector('#result').textContent=`SCORE ${score} / BEST ${best}`;overlay.classList.add('show')}for(const p of particles){p.x+=p.vx*step;p.y+=p.vy*step;p.vy+=.12*step;p.life-=dt*1.6}particles=particles.filter(p=>p.life>0)}function drawBall(b){const r=b.r;ctx.save();ctx.translate(b.x,b.y);ctx.shadowColor='#7c5d3a44';ctx.shadowBlur=6;ctx.shadowOffsetY=3;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=colors[b.t];ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='#ffffffbb';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.ellipse(-r*.26,-r*.31,r*.27,r*.12,-.6,0,Math.PI*2);ctx.fillStyle='#ffffff70';ctx.fill();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${Math.floor(r*1.23)}px 'Apple Color Emoji','Segoe UI Emoji',sans-serif`;ctx.fillText(emojis[b.t],0,1);ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fffaf0';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff0d5';ctx.fillRect(4,H-18,W-8,15);ctx.strokeStyle='#e8c5a6';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(4,H-18);ctx.lineTo(W-4,H-18);ctx.stroke();ctx.save();ctx.setLineDash([8,8]);ctx.strokeStyle=aboveTime>0?'#e85c55':'#dfaa96';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(5,94);ctx.lineTo(W-5,94);ctx.stroke();ctx.restore();if(!over){const r=radii[selected]*Math.min(1,W/360);const x=Math.max(r+5,Math.min(W-r-5,aim));ctx.save();ctx.setLineDash([5,7]);ctx.strokeStyle='#bba284';ctx.beginPath();ctx.moveTo(x,65+r);ctx.lineTo(x,H-20);ctx.stroke();ctx.restore();ctx.globalAlpha=dropDelay>0?.45:1;drawBall({x,y:60,r,t:selected});ctx.globalAlpha=1}for(const b of balls)drawBall(b);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(aboveTime>0){ctx.fillStyle='#c65b49';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('⚠️ あふれそう！',W/2,115)}}function frame(t){const dt=Math.min((t-last)/1000||.016,.033);last=t;physics(dt);draw();requestAnimationFrame(frame)}fit();reset();requestAnimationFrame(frame)})();
</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7e9ff"><title>FRIEND SUIKA 🍉</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(145deg,#f6e8ff,#ffedf0);color:#543a62;min-height:100dvh;overscroll-behavior:none}.wrap{max-width:510px;margin:auto;padding:12px 12px 20px}h1{text-align:center;font-size:27px;margin:5px 0 9px;letter-spacing:1px}.hud{display:flex;align-items:stretch;gap:9px;margin-bottom:10px}.panel{background:#ffffffc9;border:2px solid #e5c7f2;border-radius:15px;padding:8px 13px;flex:1;box-shadow:0 4px 10px #bc9ad51f}.small{font-size:11px;font-weight:800;opacity:.7}.num{font-size:25px;font-weight:900}.next{display:flex;align-items:center;gap:8px}.next img{height:44px;width:44px;object-fit:contain}.btn{border:0;border-radius:13px;background:#9e71d3;color:white;font-weight:800;padding:8px 12px;font-size:13px}.stage{position:relative;width:100%;height:min(66dvh,660px);min-height:390px;background:linear-gradient(#fff9ff,#fff0e5);border:5px solid #c99ae6;border-radius:17px;overflow:hidden;touch-action:none;box-shadow:inset 0 -12px 30px #d9b1aa24,0 9px 18px #9e7ab52e}.stage canvas{display:block;width:100%;height:100%}.tip{text-align:center;font-size:12px;margin:9px 0;color:#826b91}.overlay{position:absolute;inset:0;background:#ffffffd9;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:13px;padding:25px;z-index:4}.overlay.show{display:flex}.overlay h2{font-size:31px;margin:0}.overlay p{margin:0;line-height:1.7}.overlay button{font-size:17px;padding:12px 27px}.foot{text-align:center;font-size:11px;opacity:.6;margin-top:7px}
.intro{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#dec1f8f2,#ffdce8f5);padding:20px;transition:opacity .3s}.intro.hidden{opacity:0;pointer-events:none}.intro-card{width:min(100%,410px);text-align:center;background:#fffdf4;border:4px solid #c49add;border-radius:26px;padding:24px 18px;box-shadow:0 20px 55px #8c67a75e}.intro-card h2{font-size:35px;margin:5px 0;color:#7545a0}.intro-card p{line-height:1.7}.intro-faces{display:flex;justify-content:center;align-items:center;gap:8px;height:120px}.intro-faces img{width:30%;height:115px;object-fit:contain;filter:drop-shadow(0 5px 5px #79577755)}.startbtn{border:0;background:#a366d5;color:white;font-size:21px;font-weight:900;border-radius:16px;padding:14px 38px;box-shadow:0 6px 0 #7541a5;cursor:pointer}.intro-note{font-size:12px;color:#8b7898;margin-top:18px}
</style></head><body><div class="intro" id="intro"><div class="intro-card"><div class="intro-faces"><img src="faces/01.png"><img src="faces/05.png"><img src="faces/10.png"></div><h2>😂 FRIEND SUIKA 🍉</h2><p>友達の顔を落として合体！<br>同じ顔をくっつけて<strong>10段階進化</strong>を目指そう！</p><button class="startbtn" id="startGame">ゲームスタート ▶</button><div class="intro-note">指で左右に動かして離すと落下！<br>🎵 BGMあり（音量に注意！）</div></div></div><audio id="bgm" src="Seasonal_Fragments.mp3" preload="auto" loop></audio><main class="wrap"><h1>😂 FRIEND SUIKA 🍉</h1><div class="hud"><div class="panel"><div class="small">SCORE</div><div class="num" id="score">0</div></div><div class="panel"><div class="small">BEST</div><div class="num" id="best">0</div></div><div class="panel next"><div><div class="small">NEXT</div><img id="next" src="faces/01.png" alt="次の顔"></div></div><button class="btn" id="music" aria-label="BGM切り替え">♫ ON</button><button class="btn" id="restart">↻<br>最初から</button></div><div class="stage" id="stage"><canvas id="game"></canvas><div class="overlay" id="overlay"><h2>ゲームオーバー！</h2><p id="result"></p><button class="btn" id="again">もう一回！</button></div></div><div class="tip">👆 左右に動かして、指を離すと落ちる！ 同じ顔を合体させよう</div><div class="foot">10段階進化・友達スイカゲーム v0.7</div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script><script>
(()=>{const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d'),stage=$('#stage');let W=360,H=560,scale=1,engine,bodies=[],current=0,next=0,aim=180,score=0,best=Number(localStorage.getItem('friend_suika_best')||0),over=false,locked=false,dropAt=0,particles=[];$('#best').textContent=best;const imgs=Array.from({length:10},(_,i)=>{let a=new Image();a.src=`faces/${String(i+1).padStart(2,'0')}.png`;return a});const sizes=[46,56,67,77,89,102,117,131,149,171],points=[1,3,6,10,15,21,28,36,45,60];const random=()=>Math.floor(Math.random()*4);function size(i){return sizes[i]}function setNext(){next=random();$('#next').src=imgs[next].src}function init(){if(!window.Matter){$('#overlay').classList.add('show');$('#overlay').querySelector('h2').textContent='読み込みに失敗しました';$('#result').textContent='インターネット接続を確認して再読み込みしてね';return}if(engine)Matter.Engine.clear(engine);engine=Matter.Engine.create({gravity:{x:0,y:1.55},positionIterations:9,velocityIterations:9,constraintIterations:3,enableSleeping:true});bodies=[];particles=[];bonusFlash=null;over=false;locked=false;score=0;current=random();setNext();$('#score').textContent=0;$('#overlay').classList.remove('show');let wall={isStatic:true,friction:0.45,restitution:0.05};Matter.Composite.add(engine.world,[Matter.Bodies.rectangle(W/2,H+30,W+100,60,wall),Matter.Bodies.rectangle(-27,H/2,54,H*2,wall),Matter.Bodies.rectangle(W+27,H/2,54,H*2,wall)]);aim=W/2;dropAt=0}
function resize(){const r=stage.getBoundingClientRect();W=r.width-10;H=r.height-10;let dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(engine)init()};function add(i,x,y){let d=size(i),radius=d*.425;let b=Matter.Bodies.circle(x,y,radius,{restitution:.12,friction:.28,frictionStatic:.38,frictionAir:.0025,density:.0018,slop:.025,sleepThreshold:70});b.level=i;b.d=d;b.birth=performance.now();b.merging=false;Matter.Composite.add(engine.world,b);bodies.push(b);return b}function drop(){if(over||locked||performance.now()-dropAt<360)return;add(current,Math.max(size(current)*.5,Math.min(W-size(current)*.5,aim)),52);current=next;setNext();dropAt=performance.now();locked=true;setTimeout(()=>locked=false,370)}function pointer(e){let r=canvas.getBoundingClientRect();aim=Math.max(size(current)/2,Math.min(W-size(current)/2,e.clientX-r.left))}stage.addEventListener('pointerdown',e=>{if(over)return;pointer(e);stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!over&&e.buttons)pointer(e)});stage.addEventListener('pointerup',e=>{if(!over){pointer(e);drop()}});$('#restart').onclick=init;$('#again').onclick=init;const bgm=$('#bgm');let musicOn=true;bgm.volume=.42;function syncMusic(){if(musicOn){bgm.play().catch(()=>{});$('#music').textContent='♫ ON'}else{bgm.pause();$('#music').textContent='♫ OFF'}}$('#music').onclick=()=>{musicOn=!musicOn;syncMusic()};$('#startGame').onclick=()=>{$('#intro').classList.add('hidden');try{soundCtx ||= new (window.AudioContext||window.webkitAudioContext)();soundCtx.resume()}catch(e){}syncMusic()};
let bonusFlash=null;function bonusSound(){try{soundCtx ||= new (window.AudioContext||window.webkitAudioContext)();soundCtx.resume();const now=soundCtx.currentTime;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=soundCtx.createOscillator(),g=soundCtx.createGain(),at=now+i*.085;o.type='sine';o.frequency.setValueAtTime(f,at);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.19,at+.015);g.gain.exponentialRampToValueAtTime(.0001,at+.35);o.connect(g);g.connect(soundCtx.destination);o.start(at);o.stop(at+.36)})}catch(e){}}function popSound(){try{soundCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(soundCtx.state==='suspended')soundCtx.resume();const now=soundCtx.currentTime;const osc=soundCtx.createOscillator(),gain=soundCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(520,now);osc.frequency.exponentialRampToValueAtTime(790,now+.085);osc.frequency.exponentialRampToValueAtTime(640,now+.17);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.16,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+.22);osc.connect(gain);gain.connect(soundCtx.destination);osc.start(now);osc.stop(now+.23)}catch(e){}}function merge(a,b){if(a.merging||b.merging||a.level!==b.level)return;a.merging=b.merging=true;const i=a.level,x=(a.position.x+b.position.x)/2,y=(a.position.y+b.position.y)/2,vx=(a.velocity.x+b.velocity.x)/2,vy=(a.velocity.y+b.velocity.y)/2;Matter.Composite.remove(engine.world,[a,b]);bodies=bodies.filter(q=>q!==a&&q!==b);if(i===9){bonusSound();score+=1000;bonusFlash={x,y,t:1};for(let j=0;j<65;j++){let angle=Math.random()*Math.PI*2,speed=2+Math.random()*9;particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,t:1,bonus:true})}}else{popSound();let c=add(i+1,x,y);Matter.Body.setVelocity(c,{x:vx*.5,y:vy*.5-1.4});score+=points[i]}$('#score').textContent=score;if(score>best){best=score;localStorage.setItem('friend_suika_best',best);$('#best').textContent=best}for(let j=0;j<12;j++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,t:1})}
function image(i,x,y,d,ang=0,alpha=1){let a=imgs[i];ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.globalAlpha=alpha;if(a.complete&&a.naturalWidth){ctx.drawImage(a,-d/2,-d/2,d,d)}else{ctx.fillStyle='#d4a5e8';ctx.beginPath();ctx.arc(0,0,d*.42,0,Math.PI*2);ctx.fill()}ctx.restore()}
let last=0,acc=0;function frame(t){requestAnimationFrame(frame);let dt=Math.min(t-last||16.7,40);last=t;acc+=dt;if(engine&&!over){while(acc>=16.666){Matter.Engine.update(engine,16.666);acc-=16.666}let changed=true,mergesThisFrame=0;while(changed&&mergesThisFrame<16){changed=false;outer:for(let i=0;i<bodies.length;i++){let a=bodies[i];for(let j=i+1;j<bodies.length;j++){let b=bodies[j];if(a.level!==b.level||a.merging||b.merging )continue;let dist=Math.hypot(a.position.x-b.position.x,a.position.y-b.position.y);if(dist<=(a.d+b.d)*.425+1.5){merge(a,b);changed=true;mergesThisFrame++;break outer}}}}if(bodies.some(b=>b.position.y-b.d*.425<95&&b.speed<1.8&&t-b.birth>850)){over=true;$('#result').textContent=`スコア ${score} 点！`;$('#overlay').classList.add('show')}}else acc=0;ctx.clearRect(0,0,W,H);ctx.strokeStyle='#ec9ca8';ctx.setLineDash([8,7]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,95);ctx.lineTo(W,95);ctx.stroke();ctx.setLineDash([]);if(!over){ctx.strokeStyle='#a98cbd66';ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(aim,8);ctx.lineTo(aim,95);ctx.stroke();ctx.setLineDash([]);image(current,aim,48,size(current),0,.65)}for(const b of bodies){image(b.level,b.position.x,b.position.y,b.d,b.angle)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.t-=.035;if(p.t<=0){particles.splice(i,1);continue}ctx.fillStyle=p.bonus?`rgba(255,207,49,${p.t})`:`rgba(255,166,76,${p.t})`;ctx.beginPath();ctx.arc(p.x,p.y,(p.bonus?5:3)*p.t,0,Math.PI*2);ctx.fill()}if(bonusFlash){bonusFlash.t-=.027;if(bonusFlash.t<=0)bonusFlash=null;else{ctx.save();ctx.globalAlpha=Math.min(1,bonusFlash.t*1.8);ctx.textAlign='center';ctx.font='bold 31px system-ui';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText('+1000!',bonusFlash.x,bonusFlash.y-35-(1-bonusFlash.t)*55);ctx.fillStyle='#e5a400';ctx.fillText('+1000!',bonusFlash.x,bonusFlash.y-35-(1-bonusFlash.t)*55);ctx.restore()}}}requestAnimationFrame(frame);window.addEventListener('resize',resize);resize();init();})();
</script></body></html>
